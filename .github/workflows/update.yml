name: Update news & deploy

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
  workflow_dispatch:

permissions:
  contents: write # heartbeat commit (see last job)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Fetch feeds
        run: |
          mkdir -p _site
          go run ./fetcher -sources sources.json -out _site/feed.json

      - name: Assemble site
        run: cp -r index.html app.js style.css fonts CNAME _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. A tiny commit every ~45 quiet days keeps the schedule alive.
  heartbeat:
    needs: deploy
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit heartbeat if repo has been quiet
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%FT%TZ > .github/heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat
            git commit -m "chore: keep scheduled feed updates alive"
            git push
          fi
