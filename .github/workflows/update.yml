# Fetch every source on GitHub's servers and publish the site + feed.json to GitHub Pages.
# Timer: cron-job.org starts this every 5 minutes through GitHub's API (workflow_dispatch), as on
# heat.sala.company. GitHub's own schedule is often late or skipped (zero runs in the first 3 hours here),
# so it is only a backup, offset from the top-of-hour rush.
name: Update news & deploy

on:
  schedule:
    - cron: "2-59/5 * * * *"
  push:
  workflow_dispatch:

permissions:
  contents: write # heartbeat commit (see last job)
  pages: write
  id-token: write

# A newer run replaces an older one that is still going. On 6 Oct 2026 one deploy sat "waiting" on GitHub
# for 7.5 hours and, with cancel-in-progress off, blocked every update behind it. A normal run takes
# ~1.5 minutes and runs start every 5, so this only ever cancels a stuck run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    outputs:
      notify: ${{ steps.fetch.outputs.notify }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Fetch feeds
        id: fetch
        run: |
          mkdir -p _site
          # -carry keeps the previous build's headlines until they're 48 h old: most feeds only list their
          # latest ~15 stories, which would leave the second day nearly empty.
          # Build the fetcher once; the four feeds below reuse it.
          go build -o fetch ./fetcher
          # feed.json keeps 48 hours (the Meridian map reads it). The page shows feed-start.json (the last
          # 6 hours) first, loads feed-24h.json behind it, then only feed-new.json (the last ~75 minutes) on
          # refresh. breaking.json feeds the app's background alerts and the ntfy.sh push alerts (alerts job).
          ./fetch -sources sources.json -out _site/feed.json -carry https://news.sala.company/feed.json \
            -out24 _site/feed-24h.json -outstart _site/feed-start.json -outnew _site/feed-new.json \
            -breaking _site/breaking.json -breakingprev https://news.sala.company/breaking.json
          # Arabic, Russian and Ukrainian sources for the Meridian map (jamalxcode/globe) only. If this fails,
          # the main feed above still publishes.
          ./fetch -sources sources-local.json -out _site/local.json -carry https://news.sala.company/local.json || echo "local.json skipped"
          # Google News per-country searches for the page's "Near me" view (each country every 30 min).
          # If this fails, the page shows Near me from feed.json alone.
          ./fetch -sources sources-near.json -out _site/near.json -outstart _site/near-start.json -outnew _site/near-new.json -carry https://news.sala.company/near.json || echo "near.json skipped"
          # Arabic headlines for the page's العربية / Both setting.
          ./fetch -sources sources-ar.json -out _site/ar.json -outnew _site/ar-new.json -carry https://news.sala.company/ar.json || echo "ar.json skipped"
          # version.json: what the page polls (a few bytes) to learn whether anything changed.
          v() { [ -f "_site/$1" ] && jq -r .generated_at "_site/$1" || echo ""; }
          jq -n --arg feed "$(v feed.json)" --arg near "$(v near.json)" --arg ar "$(v ar.json)" '{feed: $feed, near: $near, ar: $ar}' > _site/version.json
          cat _site/version.json
          echo "notify=$(jq -c .notify _site/breaking.json)" >> "$GITHUB_OUTPUT"

      # Browsers may reuse app.js and style.css for 10 minutes, so right after a release a page could mix
      # new HTML with old scripts. Tag both addresses with the commit so each release loads its own files.
      - name: Assemble site
        run: |
          cp -r index.html app.js style.css fonts icons manifest.webmanifest sw.js og-image.png CNAME _site/
          v="${GITHUB_SHA::7}"
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$v\"|; s|href=\"style.css\"|href=\"style.css?v=$v\"|" _site/index.html
          grep -q "app.js?v=$v" _site/index.html && grep -q "style.css?v=$v" _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Push alerts for phones and desktops (iPhone included), through ntfy.sh: free, no account needed to
  # send or to receive. Readers subscribe to the topic in the ntfy app or at https://ntfy.sh/<topic>.
  # Runs after the deploy, so a story is only pushed once its breaking.json (which records it as
  # alerted) is live; the next build reads that and won't push it again.
  alerts:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.notify != '' && needs.build.outputs.notify != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NOTIFY: ${{ needs.build.outputs.notify }}
      TOPIC: news-sala-company-breaking
    steps:
      - name: Send to ntfy.sh
        run: |
          echo "$NOTIFY" | jq -c --arg topic "$TOPIC" '.[] | {topic: $topic, title: ("Breaking · " + (.sources | length | tostring) + " sources"), message: (.title + "\n" + (.sources[:5] | join(", "))), click: .url, tags: ["rotating_light"], priority: 4}' |
          while read -r msg; do
            curl -sS --fail --max-time 20 -H "Content-Type: application/json" -d "$msg" https://ntfy.sh/ || echo "push failed"
          done

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. A tiny commit every ~45 quiet days keeps the schedule alive.
  heartbeat:
    needs: deploy
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Commit heartbeat if repo has been quiet
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%FT%TZ > .github/heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat
            git commit -m "chore: keep scheduled feed updates alive"
            git push
          fi
